<!DOCTYPE html>
<html>
<head>
  <title>Google Sheets CRUD</title>
  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: #f5f7fa;
    }
    h2 { text-align: center; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: white;
    }

    th, td {
      padding: 10px;
      border: 1px solid #ddd;
      text-align: center;
    }

    th {
      background: #4CAF50;
      color: white;
    }

    input {
      padding: 6px;
      width: 90%;
    }

    button {
      padding: 6px 12px;
      margin: 3px;
      cursor: pointer;
    }

    .add-form {
      margin-top: 20px;
      text-align: center;
    }
  </style>
</head>

<body>

<h2>Google Sheets Manager</h2>

<button onclick="loadData()">🔄 Refresh</button>

<table id="table">
  <thead>
    <tr>
      <th>Name</th>
      <th>Date</th>
      <th>Remark</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<div class="add-form">
  <h3>Add New Record</h3>
  <input id="name" placeholder="Name">
  <input id="date" type="date">
  <input id="remark" placeholder="Remark">
  <button onclick="addRecord()">Add</button>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbykHJqRxpg8bFl1IftcsYREggr678WROOkUmvhF7fA74TsMHJaZ1xgFUWOwRbTlE3qsvA/exec";

async function loadData() {
  const res = await fetch(API_URL);
  const data = await res.json();

  const tbody = document.querySelector("#table tbody");
  tbody.innerHTML = "";

  data.slice(1).forEach((row, index) => {
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td contenteditable="true">${row[0]}</td>
      <td contenteditable="true">${row[1]}</td>
      <td contenteditable="true">${row[2]}</td>
      <td>
        <button onclick="saveRow(this, ${index + 2})">💾 Save</button>
      </td>
    `;

    tbody.appendChild(tr);
  });
}

async function addRecord() {
  const name = document.getElementById("name").value;
  const date = document.getElementById("date").value;
  const remark = document.getElementById("remark").value;

  await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "add",
      name,
      date,
      remark
    })
  });

  loadData();
}

async function saveRow(btn, rowNumber) {
  const tr = btn.parentElement.parentElement;
  const cells = tr.querySelectorAll("td");

  const name = cells[0].innerText;
  const date = cells[1].innerText;
  const remark = cells[2].innerText;

  await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "update",
      row: rowNumber,
      name,
      date,
      remark
    })
  });

  alert("Saved!");
}

loadData();
</script>

</body>
</html>
